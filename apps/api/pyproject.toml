[project]
name = "mc-panel-api"
version = "0.4.2"
description = "Safety-first API for the AI-native Minecraft panel"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psutil>=7,<8",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-psutil>=7.0.0.20250601,<8",
]

[project.scripts]
mc-panel-api = "mc_panel_api.main:run"
mc-panel-admin = "mc_panel_api.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_panel_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mc_panel_api"]
