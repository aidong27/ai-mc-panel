global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend mc_panel_public_port_80
    bind :80
    tcp-request inspect-delay 2s
    acl is_tls req.ssl_hello_type 1
    tcp-request content accept if is_tls
    tcp-request content accept if HTTP
    use_backend mc_panel_https if is_tls
    default_backend mc_panel_http

backend mc_panel_http
    server caddy_http 127.0.0.1:8080 check

backend mc_panel_https
    server caddy_https 127.0.0.1:8443 check
